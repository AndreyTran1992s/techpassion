# Nginx Reverse Proxy & Security Hardening Configuration

# 1. Rate Limiting Zone chống tấn công DDoS và Brute Force
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=15r/s;
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=30r/s;

server {
    listen 80;
    server_name localhost;

    # 2. Ẩn thông tin phiên bản Nginx chống dò lỗ hổng
    server_tokens off;

    # 3. Gzip Compression tối ưu tốc độ tải trang
    gzip on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # 4. Chặn triệt để các file ẩn, file cấu hình nhạy cảm (.env, .git, .sql, .bak)
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* \.(sql|bak|env|config|sh|py|md|log)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # 5. Chặn các User-Agent quét lỗ hổng tự động phổ biến (sqlmap, nikto, wpscan)
    if ($http_user_agent ~* (sqlmap|nikto|wpscan|acunetix|nessus|masscan)) {
        return 403;
    }

    # 6. Backend API Proxy (Có áp dụng Rate Limiting)
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://backend:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts chống Slowloris DoS
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # 7. Frontend Next.js Web Proxy
    location / {
        limit_req zone=general_limit burst=50 nodelay;

        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
